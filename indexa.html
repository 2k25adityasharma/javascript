<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>To Do List</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:linear-gradient(135deg,#4facfe,#00f2fe);
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}

.container{
    width:400px;
    background:#fff;
    padding:25px;
    border-radius:12px;
    box-shadow:0 10px 25px rgba(0,0,0,.2);
}

h1{
    text-align:center;
    margin-bottom:20px;
    color:#333;
}

.input-box{
    display:flex;
    gap:10px;
}

input{
    flex:1;
    padding:12px;
    border:2px solid #ddd;
    border-radius:8px;
    font-size:16px;
    outline:none;
}

input:focus{
    border-color:#4facfe;
}

#addBtn{
    padding:12px 18px;
    border:none;
    background:#4facfe;
    color:white;
    border-radius:8px;
    cursor:pointer;
    font-size:16px;
}

#addBtn:hover{
    background:#268df5;
}

ul{
    list-style:none;
    margin-top:20px;
}

li{
    display:flex;
    justify-content:space-between;
    align-items:center;
    background:#f3f3f3;
    margin-bottom:10px;
    padding:12px;
    border-radius:8px;
}

.task{
    flex:1;
    cursor:pointer;
    word-break:break-word;
}

.completed{
    text-decoration:line-through;
    color:gray;
}

.delete-btn{
    background:#ff4d4d;
    color:white;
    border:none;
    padding:8px 12px;
    border-radius:6px;
    cursor:pointer;
}

.delete-btn:hover{
    background:#d63031;
}

.stats{
    display:flex;
    justify-content:space-between;
    margin-top:20px;
    font-size:15px;
    color:#555;
}

#clearBtn{
    width:100%;
    margin-top:20px;
    padding:12px;
    border:none;
    border-radius:8px;
    background:#222;
    color:white;
    cursor:pointer;
}

#clearBtn:hover{
    background:#000;
}
</style>
</head>

<body>

<div class="container">

    <h1> To Do List</h1>

    <div class="input-box">
        <input
            type="text"
            id="taskInput"
            placeholder="Enter your task..."
        >

        <button id="addBtn">Add</button>
    </div>

    <ul id="taskList"> </ul>


    <div id="blank"></div>



    <div class="stats">
        <span>Total: <span id="totalTasks">0</span></span>
        <span>Completed: <span id="completedTasks">0</span></span>
    </div>

    <button id="clearBtn">Clear All</button>

</div>

<script>
    let ul = document.getElementById("taskList")
 let text = document.getElementById("taskInput")
 let total=document.getElementById("totalTasks")
 let clear=document.getElementById("taskList")
 let complete = document.getElementById("completedTasks")
 let blank = document.getElementById("blank")


 document.getElementById("addBtn").addEventListener("click",function(){
   if(text.value==""){
     blank.innerText="Enter Task"
     return
   }
      blank.innerText=""
       let li = document.createElement("li")
      li.innerText= text.value
ul.appendChild(li)

 li.addEventListener("click", function () {
        this.classList.toggle("completed");
        complete.innerText++;
    });
    total.innerText++
    text.value=""
    text.focus()
    }
  
    )
document.getElementById("clearBtn").addEventListener("click",function(){
    ul.innerHTML=""
    blank.innerHTML=""
    total.innerText=0
    text.value=""
    complete.innerText=""
    complete.innerText=0
})



</script>

</body>
</html>
