<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<style>
    *{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#1b1b1b;
}

.calculator{
    width:340px;
    background:#2b2b2b;
    padding:20px;
    border-radius:20px;
    box-shadow:0 10px 30px rgba(0,0,0,.4);
}

#display{
    width:100%;
    height:70px;
    border:none;
    outline:none;
    border-radius:10px;
    background:#111;
    color:white;
    font-size:2rem;
    text-align:right;
    padding:15px;
    margin-bottom:20px;
}

.buttons{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:12px;
}

button{
    height:65px;
    border:none;
    border-radius:12px;
    font-size:1.3rem;
    cursor:pointer;
    background:#444;
    color:white;
    transition:.2s;
}

button:hover{
    background:#5c5c5c;
}

button:active{
    transform:scale(.95);
}

button:nth-child(4),
button:nth-child(8),
button:nth-child(12),
button:nth-child(16),
button:nth-child(20){
    background:#ff9800;
}

button:nth-child(4):hover,
button:nth-child(8):hover,
button:nth-child(12):hover,
button:nth-child(16):hover,
button:nth-child(20):hover{
    background:#ffb74d;
}

button:nth-child(1),
button:nth-child(2){
    background:#d32f2f;
}

button:nth-child(1):hover,
button:nth-child(2):hover{
    background:#ef5350;
}
</style>
<body>

    <div class="calculator">

        <input type="text" id="display" readonly placeholder="0">

        <div class="buttons">

            <button>C</button>
            <button>DEL</button>
            <button>%</button>
            <button>/</button>

            <button>7</button>
            <button>8</button>
            <button>9</button>
            <button>*</button>

            <button>4</button>
            <button>5</button>
            <button>6</button>
            <button>-</button>

            <button>1</button>
            <button>2</button>
            <button>3</button>
            <button>+</button>

            <button>00</button>
            <button>0</button>
            <button>.</button>
            <button>=</button>

        </div>

    </div>
</body>
<script>

const display = document.getElementById("display");


const buttons = document.getElementsByTagName("button");


for (let i = 0; i < buttons.length; i++) {

    buttons[i].addEventListener("click", function () {

        
        let value = buttons[i].innerText;

     
        if (value === "C") {
            display.value = "";
        }

        
        else if (value === "DEL") {
            display.value = display.value.slice(0, -1);
        }

        else if (value === "=") {

            try {
                display.value = eval(display.value);
            }
            catch {
                display.value = "Error";
            }

        }

       
        else {
            display.value += value;
        }

    });

}

</script>
</html>
