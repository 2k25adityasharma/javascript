<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Chatbot</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#111827;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    padding:15px;
}

.container{
    width:100%;
    max-width:420px;
    height:90vh;
    max-height:650px;
    background:#1f2937;
    border-radius:15px;
    overflow:hidden;
    display:flex;
    flex-direction:column;
    box-shadow:0 0 20px rgba(0,0,0,.4);
}

.chat-header{
    background:#2563eb;
    color:#fff;
    text-align:center;
    font-size:22px;
    font-weight:bold;
    padding:18px;
}

.chat-box{
    flex:1;
    overflow-y:auto;
    padding:15px;
}

.chat-box::-webkit-scrollbar{
    width:6px;
}

.chat-box::-webkit-scrollbar-thumb{
    background:#2563eb;
    border-radius:10px;
}

.user-message{
    background:#2563eb;
    color:white;
    width:fit-content;
    max-width:80%;
    margin-left:auto;
    margin-bottom:15px;
    padding:12px;
    border-radius:12px;
    word-wrap:break-word;
}

.bot-message{
    background:#374151;
    color:white;
    width:fit-content;
    max-width:80%;
    margin-bottom:15px;
    padding:12px;
    border-radius:12px;
    word-wrap:break-word;
}

.input-area{
    display:flex;
    align-items:center;
    gap:10px;
    padding:15px;
    background:#111827;
}

input{
    flex:1;
    min-width:0;
    padding:12px;
    border:none;
    outline:none;
    border-radius:8px;
    font-size:16px;
}

button{
    flex-shrink:0;
    border:none;
    background:#2563eb;
    color:white;
    padding:12px 18px;
    border-radius:8px;
    cursor:pointer;
    transition:.3s;
}

button:hover{
    background:#1d4ed8;
}

/* Mobile Responsive */

@media(max-width:480px){

body{
    padding:0;
}

.container{
    width:100%;
    max-width:none;
    height:100vh;
    max-height:none;
    border-radius:0;
}

.chat-header{
    font-size:20px;
    padding:16px;
}

.chat-box{
    padding:12px;
}

.user-message,
.bot-message{
    max-width:90%;
    font-size:15px;
}

.input-area{
    padding:10px;
    gap:8px;
}

input{
    padding:10px;
    font-size:15px;
}

button{
    padding:10px 14px;
    font-size:14px;
}
}

</style>
</head>

<body>

<div class="container">

<div class="chat-header">
🤖 AI Chatbot
</div>

<div class="chat-box" id="chatBox">

<div class="bot-message">
Hello! How can I help you today?
</div>

</div>

<div class="input-area">

<input
type="text"
id="userInput"
placeholder="Ask me anything..."
>

<button id="sendBtn">Send</button>

</div>

</div>

<script>

const chatBox=document.getElementById("chatBox");
const userInput=document.getElementById("userInput");
const sendBtn=document.getElementById("sendBtn");


const API_KEY="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";

function addMessage(text,className){

const div=document.createElement("div");

div.className=className;

div.innerText=text;

chatBox.appendChild(div);

chatBox.scrollTop=chatBox.scrollHeight;

}

async function askAI(question){

const response=await fetch("https://openrouter.ai/api/v1/chat/completions",{

method:"POST",

headers:{
Authorization:`Bearer ${API_KEY}`,
"Content-Type":"application/json",
"HTTP-Referer":window.location.origin,
"X-Title":"AI Chatbot"
},

body:JSON.stringify({

model:"poolside/laguna-s-2.1:free",

messages:[
{
role:"system",
content:"You are a helpful AI assistant."
},
{
role:"user",
content:question
}
]

})

});

const data=await response.json();

if(!response.ok){

throw new Error(data.error?.message || "API Error");

}

return data.choices?.[0]?.message?.content || "No response.";

}

async function sendMessage(){

const text=userInput.value.trim();

if(text==="") return;

addMessage(text,"user-message");

userInput.value="";

const typing=document.createElement("div");

typing.className="bot-message";

typing.innerText="Typing...";

chatBox.appendChild(typing);

chatBox.scrollTop=chatBox.scrollHeight;

try{

const reply=await askAI(text);

typing.remove();

addMessage(reply,"bot-message");

}
catch(err){

typing.remove();

addMessage("❌ "+err.message,"bot-message");

}

}

sendBtn.addEventListener("click",sendMessage);

userInput.addEventListener("keydown",(e)=>{

if(e.key==="Enter"){

sendMessage();

}

});

</script>

</body>
</html>
